[project]
name = "looker-kc-sync"
version = "0.1.0"
description = "Knowledge Catalog (Dataplex) to Looker LookML Synchronization Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-dataplex>=1.15.0",
    "google-cloud-secret-manager>=2.16.0",
    "jinja2>=3.1.0",
    "lkml>=1.3.7",
    "looker-sdk>=26.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.scripts]
looker-kc-sync = "looker_kc_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/looker_kc_sync"]
