profile_name: "semantic_curation"
description: "Reference standard mapping profile for Knowledge Catalog semantic-curation aspect"
auto_generate_kpi_measures: false
use_dimension_groups: true
use_ai_data_documentation: true
auto_generate_partition_cluster_filters: true
always_filter_on_partition_key: false

explore_policy:
  enabled: true
  strategy: "tagged"
  required_tags: ["core_bi", "explore", "fact"]
  table_allowlist: []
  table_patterns: ["fct_*", "fact_*"]
  exclude_dimension_tables: true

certification_rule:
  path: "semantic-curation.status"
  operator: "equals"
  values: ["CERTIFIED"]

exclusions:
  - path: "dataplex.policy_tags"
    operator: "contains"
    values: ["pii_restricted"]

field_mappings:
  label:
    sources:
      - path: "semantic-curation.business_label"
      - transform: "title_case(column_name)"

  description:
    sources:
      - path: "semantic-curation.business_description"
      - path: "column.description"
      - path: "data-documentation.description"

  synonyms:
    sources:
      - path: "semantic-curation.synonyms"
        type: "list"

  tags:
    static_tags: ["certified"]
    dynamic_tags:
      - path: "semantic-curation.governance_tags"

  suggestions:
    sources:
      - path: "semantic-curation.allowed_values"
        type: "list"

  value_format_name:
    sources:
      - path: "semantic-curation.format_pattern"
    lookup_map:
      currency: "usd"
      usd: "usd"
      percent: "percent_2"
      percentage: "percent_2"
      decimal_0: "decimal_0"
      integer: "decimal_0"
